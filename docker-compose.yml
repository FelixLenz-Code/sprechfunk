services:
  sprechfunk:
    # Pull the prebuilt image from GitHub Container Registry (built by CI).
    # Replace the owner/name if you forked the repo.
    image: ghcr.io/felixlenz-code/sprechfunk:latest
    # To build locally instead, comment out `image:` above and uncomment:
    # build: .
    container_name: sprechfunk
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      MEDIA_ENCRYPTION_KEY: ${MEDIA_ENCRYPTION_KEY:?MEDIA_ENCRYPTION_KEY is required - see .env.example}
      # Voice messages older than this are auto-deleted; orphan files are cleaned too.
      VOICE_RETENTION_DAYS: ${VOICE_RETENTION_DAYS:-365}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-24}
    volumes:
      - sprechfunk-data:/app/data
    ports:
      # Bound to all interfaces so a reverse proxy on another host can reach it.
      # The port serves plain HTTP (TLS is terminated by your proxy) — restrict
      # access with a firewall, or set BIND_ADDR to 127.0.0.1 / an internal IP.
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8080}:8080"

volumes:
  sprechfunk-data:
